// --- SOUND SYNTHESIZER (Web Audio API) ---
function createSoundEngine() {
  let audioCtx = null;
  let isMuted = true;
  const getCtx = () => {
    if (!audioCtx && typeof window !== 'undefined') {
      const AudioContextClass = window.AudioContext || window.webkitAudioContext;
      if (AudioContextClass) audioCtx = new AudioContextClass();
    }
    if (audioCtx && audioCtx.state === 'suspended') {
      audioCtx.resume();
    }
    return audioCtx;
  };
  const playTone = (freq, type, duration, gainVal = 0.04) => {
    if (isMuted) return;
    try {
      const ctx = getCtx();
      if (!ctx) return;
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.type = type;
      osc.frequency.setValueAtTime(freq, ctx.currentTime);
      gain.gain.setValueAtTime(gainVal, ctx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + duration);
      osc.connect(gain);
      gain.connect(ctx.destination);
      osc.start();
      osc.stop(ctx.currentTime + duration);
    } catch (e) {}
  };
  return {
    get isMuted() {
      return isMuted;
    },
    toggleMute() {
      isMuted = !isMuted;
      return isMuted;
    },
    step() {
      playTone(587.33, 'sine', 0.09, 0.03);
    },
    // D5
    product() {
      playTone(783.99, 'triangle', 0.15, 0.04);
    },
    // G5
    success() {
      if (isMuted) return;
      [523.25, 659.25, 783.99, 1046.5].forEach((f, i) => {
        setTimeout(() => playTone(f, 'sine', 0.35, 0.05), i * 90);
      });
    }
  };
}

// --- MATRIX OPERATIONS UTILS ---
function createZeroMatrix(r, c) {
  return Array.from({
    length: r
  }, () => Array(c).fill(0));
}
function cloneMatrix(M) {
  return M.map(row => [...row]);
}
function matrixAdd(A, B) {
  const r = A.length,
    c = A[0].length;
  const res = createZeroMatrix(r, c);
  for (let i = 0; i < r; i++) {
    for (let j = 0; j < c; j++) res[i][j] = (A[i]?.[j] ?? 0) + (B[i]?.[j] ?? 0);
  }
  return res;
}
function matrixSub(A, B) {
  const r = A.length,
    c = A[0].length;
  const res = createZeroMatrix(r, c);
  for (let i = 0; i < r; i++) {
    for (let j = 0; j < c; j++) res[i][j] = (A[i]?.[j] ?? 0) - (B[i]?.[j] ?? 0);
  }
  return res;
}
function partitionMatrix(M) {
  const n = M.length;
  const half = Math.floor(n / 2);
  const M11 = createZeroMatrix(half, half);
  const M12 = createZeroMatrix(half, half);
  const M21 = createZeroMatrix(half, half);
  const M22 = createZeroMatrix(half, half);
  for (let i = 0; i < half; i++) {
    for (let j = 0; j < half; j++) {
      M11[i][j] = M[i][j];
      M12[i][j] = M[i][j + half];
      M21[i][j] = M[i + half][j];
      M22[i][j] = M[i + half][j + half];
    }
  }
  return {
    M11,
    M12,
    M21,
    M22
  };
}
function combineSubmatrices(M11, M12, M21, M22) {
  const half = M11.length;
  const n = half * 2;
  const res = createZeroMatrix(n, n);
  for (let i = 0; i < half; i++) {
    for (let j = 0; j < half; j++) {
      res[i][j] = M11[i][j];
      res[i][j + half] = M12[i][j];
      res[i + half][j] = M21[i][j];
      res[i + half][j + half] = M22[i][j];
    }
  }
  return res;
}
function formatCompact(M) {
  if (!M || M.length === 0) return '0';
  if (M.length === 1 && M[0].length === 1) return `${M[0][0]}`;
  return `[${M.map(r => r.join(' ')).join('; ')}]`;
}

// Traditional Multiplication O(n^3)
function multiplyTraditional(A, B) {
  const t0 = performance.now();
  const n = A.length,
    m = B[0].length,
    kDim = B.length;
  const result = createZeroMatrix(n, m);
  let mults = 0,
    adds = 0;
  for (let i = 0; i < n; i++) {
    for (let j = 0; j < m; j++) {
      let sum = 0;
      for (let k = 0; k < kDim; k++) {
        sum += (A[i][k] ?? 0) * (B[k][j] ?? 0);
        mults++;
        if (k > 0) adds++;
      }
      result[i][j] = sum;
    }
  }
  return {
    result,
    mults,
    adds,
    timeMs: Math.max(0.01, performance.now() - t0)
  };
}

// Pure Recursive Strassen for sub-blocks
function computeStrassenPure(A, B) {
  const n = A.length;
  if (n === 1) return {
    result: [[A[0][0] * B[0][0]]],
    mults: 1,
    adds: 0
  };
  let mults = 0,
    adds = 0;
  const {
    M11: A11,
    M12: A12,
    M21: A21,
    M22: A22
  } = partitionMatrix(A);
  const {
    M11: B11,
    M12: B12,
    M21: B21,
    M22: B22
  } = partitionMatrix(B);
  const add = (X, Y) => {
    adds += X.length * X[0].length;
    return matrixAdd(X, Y);
  };
  const sub = (X, Y) => {
    adds += X.length * X[0].length;
    return matrixSub(X, Y);
  };
  const rec = (X, Y) => {
    const r = computeStrassenPure(X, Y);
    mults += r.mults;
    adds += r.adds;
    return r.result;
  };
  const P1 = rec(add(A11, A22), add(B11, B22));
  const P2 = rec(add(A21, A22), B11);
  const P3 = rec(A11, sub(B12, B22));
  const P4 = rec(A22, sub(B21, B11));
  const P5 = rec(add(A11, A12), B22);
  const P6 = rec(sub(A21, A11), add(B11, B12));
  const P7 = rec(sub(A12, A22), add(B21, B22));
  const C11 = add(sub(add(P1, P4), P5), P7);
  const C12 = add(P3, P5);
  const C21 = add(P2, P4);
  const C22 = add(add(sub(P1, P2), P3), P6);
  return {
    result: combineSubmatrices(C11, C12, C21, C22),
    mults,
    adds
  };
}

// Verification against traditional O(n^3)
function verifyResults(A, B, tolerance = 1e-9) {
  const trad = multiplyTraditional(A, B);
  const strass = computeStrassenWithSteps(A, B);
  const r = A.length,
    c = B[0].length;
  let maxDelta = 0,
    isIdentical = true;

    for (let j = 0; j < c; j++) {
      const diff = Math.abs((strass.result[i]?.[j] ?? 0) - (trad.result[i]?.[j] ?? 0));

      if (diff > tolerance) isIdentical = false;
    }
  }
  return {
    isIdentical,
    maxDelta,
    strassResult: strass.result,
    tradResult: trad.result,
    strassMults: strass.mults,
    tradMults: trad.mults,
    strassAdds: strass.adds,
    tradAdds: trad.adds,
    strassTime: strass.timeMs,
    tradTime: trad.timeMs
  };
}
